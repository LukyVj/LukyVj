<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Lucas Bonomi, Design Engineer at Strapi">
  <title>Lucas Bonomi, Design Engineer at Strapi</title>
  <style>
    .float { animation: float ease-in-out infinite alternate; transform-box: fill-box; }
    .shadow { animation: squash ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    @keyframes float { from { transform: translateY(0) } to { transform: translateY(calc(var(--amp) * -1)) } }
    @keyframes squash { from { transform: translateY(0) scaleX(1); opacity:1 } to { transform: translateY(var(--amp)) scaleX(.82); opacity:.6 } }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .float, .shadow, .caret { animation: none } }
    text { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfbf6"/><stop offset="1" stop-color="#f1f2e8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#22241c" stroke-opacity=".06"/>
    </pattern>
    <radialGradient id="fade" cx="78%" cy="45%" r="60%">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="gm"><rect width="1280" height="360" fill="url(#fade)"/></mask>
    <radialGradient id="glow" cx="77%" cy="46%" r="38%">
      <stop offset="0" stop-color="#879b00" stop-opacity=".22"/><stop offset="1" stop-color="#879b00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim" cx="60%" cy="70%" r="55%">
      <stop offset=".75" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".18"/>
    </radialGradient>
    <radialGradient id="sh">
      <stop offset="0" stop-color="#22241c" stop-opacity=".22"/><stop offset="1" stop-color="#22241c" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="round"><rect width="1280" height="360" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#grid)" mask="url(#gm)"/>
    <rect width="1280" height="360" fill="url(#glow)"/>
    
  <g class="float" style="animation-duration:7s;animation-delay:-0s;--amp:10px">
    <ellipse class="shadow" cx="985" cy="291" rx="78.2" ry="14.72" fill="url(#sh)" style="animation-duration:7s;animation-delay:-0s"/>
    <circle cx="985" cy="165" r="92" fill="url(#s1)"/>
    <circle cx="985" cy="165" r="92" fill="url(#rim)" opacity=".9"/>
    <ellipse cx="951.88" cy="126.36" rx="23.92" ry="15.64" fill="#ffffff" opacity=".55" transform="rotate(-28 951.88 126.36)" filter="url(#soft)"/>
  </g>
  <defs>
    <radialGradient id="s1" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#e9f57a"/>
      <stop offset=".55" stop-color="#879b00"/>
      <stop offset="1" stop-color="#3d4600"/>
    </radialGradient>
  </defs>
  <g class="float" style="animation-duration:6s;animation-delay:-2s;--amp:14px">
    <ellipse class="shadow" cx="1130" cy="198" rx="37.4" ry="7.04" fill="url(#sh)" style="animation-duration:6s;animation-delay:-2s"/>
    <circle cx="1130" cy="120" r="44" fill="url(#s2)"/>
    <circle cx="1130" cy="120" r="44" fill="url(#rim)" opacity=".9"/>
    <ellipse cx="1114.16" cy="101.52" rx="11.440000000000001" ry="7.48" fill="#ffffff" opacity=".55" transform="rotate(-28 1114.16 101.52)" filter="url(#soft)"/>
  </g>
  <defs>
    <radialGradient id="s2" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#d9dccb"/>
      <stop offset="1" stop-color="#55584a"/>
    </radialGradient>
  </defs>
  <g class="float" style="animation-duration:5.5s;animation-delay:-1s;--amp:12px">
    <ellipse class="shadow" cx="1150" cy="302" rx="25.5" ry="4.8" fill="url(#sh)" style="animation-duration:5.5s;animation-delay:-1s"/>
    <circle cx="1150" cy="238" r="30" fill="url(#s3)"/>
    <circle cx="1150" cy="238" r="30" fill="url(#rim)" opacity=".9"/>
    <ellipse cx="1139.2" cy="225.4" rx="7.800000000000001" ry="5.1000000000000005" fill="#ffffff" opacity=".55" transform="rotate(-28 1139.2 225.4)" filter="url(#soft)"/>
  </g>
  <defs>
    <radialGradient id="s3" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ffd1b8"/>
      <stop offset=".55" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#7a2400"/>
    </radialGradient>
  </defs>
  <g class="float" style="animation-duration:6.5s;animation-delay:-3s;--amp:16px">
    <ellipse class="shadow" cx="860" cy="148" rx="18.7" ry="3.52" fill="url(#sh)" style="animation-duration:6.5s;animation-delay:-3s"/>
    <circle cx="860" cy="92" r="22" fill="url(#s4)"/>
    <circle cx="860" cy="92" r="22" fill="url(#rim)" opacity=".9"/>
    <ellipse cx="852.08" cy="82.76" rx="5.720000000000001" ry="3.74" fill="#ffffff" opacity=".55" transform="rotate(-28 852.08 82.76)" filter="url(#soft)"/>
  </g>
  <defs>
    <radialGradient id="s4" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#c9e2ff"/>
      <stop offset=".55" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#142a7a"/>
    </radialGradient>
  </defs>
    <g transform="translate(72 0)">
      <rect x="0" y="86" width="226" height="32" rx="16" fill="#ffffff" stroke="#e2e3d6"/>
      <circle cx="18" cy="102" r="5" fill="#879b00"/>
      <text x="32" y="107" font-size="14" font-weight="600" fill="#22241c" letter-spacing=".2">Design Engineer at Strapi</text>
      <text x="-3" y="190" font-size="72" font-weight="800" fill="#22241c" letter-spacing="-2.6">Lucas Bonomi</text>
      <text x="0" y="234" font-size="22" fill="#6b6d5e">Creative coder. I build tools where design meets code.</text>
      <text class="mono" x="0" y="290" font-size="15" fill="#6b6d5e"><tspan fill="#879b00">❴ ● ❵</tspan>  css · shaders · webgpu · design systems<tspan class="caret" fill="#879b00"> ▍</tspan></text>
    </g>
    <rect x=".5" y=".5" width="1279" height="359" rx="19.5" fill="none" stroke="#e2e3d6"/>
  </g>
</svg>
