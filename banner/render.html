<!doctype html><html><head><meta charset="utf-8">
<style>
  :root { --bg:#16170f; --fg:#f4f5ec; --muted:#9a9c8c; --accent:#b5cc1c; --pill:#22241c; --line:#2c2e22; }
  html.light { --bg:#f4f4ec; --fg:#22241c; --muted:#6b6d5e; --accent:#879b00; --pill:#ffffff; --line:#e2e3d6; }
  * { margin:0; box-sizing:border-box; }
  body { width:1280px; height:360px; overflow:hidden; background:var(--bg); font-family:Inter, sans-serif; }
  canvas { position:absolute; inset:0; width:1280px; height:360px; display:block; }
  .txt { position:absolute; left:72px; top:0; height:360px; display:flex; flex-direction:column; justify-content:center; color:var(--fg); }
  .pill { display:inline-flex; align-items:center; gap:10px; align-self:flex-start; height:32px; padding:0 14px 0 12px; border-radius:16px; background:var(--pill); border:1px solid var(--line); font-size:14px; font-weight:600; letter-spacing:.2px; }
  .pill i { width:10px; height:10px; border-radius:50%; background:var(--accent); }
  h1 { font-size:72px; font-weight:800; letter-spacing:-2.6px; line-height:1; margin:22px 0 14px -3px; }
  p { font-size:22px; color:var(--muted); }
  code { margin-top:30px; font:15px "DejaVu Sans Mono", monospace; color:var(--muted); }
  code b { color:var(--accent); font-weight:400; }
  .frame { position:absolute; inset:0; border:1px solid var(--line); pointer-events:none; }
</style></head><body>
<canvas id="c" width="1280" height="360"></canvas>
<div class="txt">
  <span class="pill"><i></i>Design Engineer at Strapi</span>
  <h1>Lucas Bonomi</h1>
  <p>Creative coder. I build tools where design meets code.</p>
  <code><b>❴ ● ❵</b>&nbsp; rendered with GSS · css for 3D scenes</code>
</div>
<script type="module">
import { compile, mount } from './node_modules/gss-lang/lib/index.js';
const light = location.search.includes('light');
if (light) document.documentElement.classList.add('light');
const bg = light ? '#f4f4ec' : '#16170f';
const src = await (await fetch('./banner.gss')).text();
const css = src.replaceAll('BG', bg).replaceAll('AMB', light ? '0.55' : '0.25');
window.scene = mount(document.getElementById('c'), compile(css), { controls:false, adaptDpr:false });
window.ready = true;
</script>
</body></html>
